# docsite: managed file, run `python3 docsite.py update` to refresh.
# 使用 GitHub 推荐的静态 HTML 部署方式（docsify，无需构建）
# 注意：早期接入的仓库沿用了 GitHub 默认模板名 static.yml；内容等价，无需改名。
# actions 版本由本模板统一维护（当前：checkout v7 / configure-pages v6 /
# upload-pages-artifact v5 / deploy-pages v5）。升级只改这里，再由 update 下发。

name: Deploy static content to Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
