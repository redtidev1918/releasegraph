name: Promote stable v1
on:
  push:
    tags: ["v1.*.*"]
  workflow_dispatch:
    inputs:
      affected_capabilities:
        description: "Comma-separated capabilities this release changes (binary, npm, pypi, github-release, checksums)"
        required: false
        default: ""
        type: string
      breaking:
        description: "Mark this release as breaking"
        required: false
        default: false
        type: boolean
      version:
        description: "Version to promote when dispatched manually (e.g. 1.5.0)"
        required: false
        default: ""
        type: string
permissions:
  contents: write
  actions: write # post-release actions dispatch workflow_dispatch
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11"}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version-file: go.mod}
      - run: python -m unittest discover -v
      - run: go vet ./...
      - run: go test ./...

  build-binaries:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version-file: go.mod}
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          extension=""
          test "${{ matrix.goos }}" != windows || extension=.exe
          mkdir -p dist/release
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath \
            -ldflags "-s -w -X github.com/redtidev1918/releasegraph/internal/cli.version=$version" \
            -o "dist/release/releasegraph-${{ matrix.goos }}-${{ matrix.goarch }}${extension}" \
            ./cmd/releasegraph
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: releasegraph-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/release/releasegraph-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 1

  promote:
    needs: [test, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: releasegraph-*
          path: dist/release
          merge-multiple: true
      - name: Resolve release identity
        run: |
          set -euo pipefail
          echo "RELEASEGRAPH_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "RELEASE_BUILD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Write ReleaseGraph compatibility metadata
        # The affected scope travels with the immutable tag: a tag push has no
        # inputs, and the annotation is the reviewable, immutable declaration.
        env:
          AFFECTED_CAPABILITIES: ${{ inputs.affected_capabilities || '' }}
          BREAKING: ${{ inputs.breaking || 'false' }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - "$RELEASEGRAPH_VERSION" <<'PY'
          import os, re, subprocess, sys
          from release_infra import compatibility

          declared = os.environ.get("AFFECTED_CAPABILITIES", "")
          breaking = os.environ.get("BREAKING", "false").lower() == "true"
          if not declared:
              tag = os.environ.get("RELEASE_TAG", "") or sys.argv[1]
              message = subprocess.run(
                  ["git", "tag", "-l", "--format=%(contents)", tag],
                  capture_output=True, text=True, check=False,
              ).stdout
              for line in message.splitlines():
                  key, _, value = line.partition(":")
                  key = key.strip().lower()
                  if key == "affected-capabilities":
                      declared = value
                  elif key == "breaking":
                      breaking = value.strip().lower() in {"true", "yes", "1"}
          affected = [c for c in re.split(r"[,\s]+", declared) if c]
          path = compatibility.write(sys.argv[1], affected_capabilities=affected, breaking=breaking)
          print(f"wrote {path} with affected_capabilities={affected} breaking={breaking}")
          PY
      - name: Plan idempotent release
        id: plan
        run: |
          python -m release_infra.cli workflow-plan --version "$RELEASEGRAPH_VERSION" --github-output "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      # Healthy release + pending post-release actions = resume mode: never re-stage
      # or re-publish (the release is already public), just audit and run the
      # missing post-release actions below.
      - name: Create or resume draft
        if: steps.plan.outputs.run_release == '1' && steps.plan.outputs.release_health != 'healthy'
        run: python -m release_infra.cli stage --version "$RELEASEGRAPH_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish and verify release
        if: steps.plan.outputs.run_release == '1' && steps.plan.outputs.release_health != 'healthy'
        run: python -m release_infra.cli publish --version "$RELEASEGRAPH_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Audit release
        run: python -m release_infra.cli audit --version "$RELEASEGRAPH_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Post-release actions
        if: steps.plan.outputs.run_release == '1' && steps.plan.outputs.post_release_json != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m release_infra.cli post-release run --version "$RELEASEGRAPH_VERSION"

      - name: Move stable channel after audit
        run: |
          git tag -f v1 "$GITHUB_SHA"
          git push origin refs/tags/v1 --force
