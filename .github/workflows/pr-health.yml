name: Fleet PR Health
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: fleet-pr-health
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/releasegraph" ./cmd/releasegraph
      - name: Create read-only fleet token
        id: reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASEGRAPH_CLIENT_ID }}
          private-key: ${{ secrets.RELEASEGRAPH_PRIVATE_KEY }}
          owner: ${{ vars.RELEASEGRAPH_OWNER }}
          permission-metadata: read
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
          permission-checks: read
          # Branch protection and active rulesets live under the administration
          # permission; required-check evidence is incomplete without it.
          permission-administration: read
      - name: Audit current PR heads
        env:
          RELEASEGRAPH_FLEET_TOKEN: ${{ steps.reader.outputs.token }}
        run: '"$RUNNER_TEMP/releasegraph" pr-health audit --manifest fleet.yaml --report pr-health.json'
      - name: Preserve scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: pr-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: pr-health.json
          retention-days: 30
          if-no-files-found: error
      - name: Report missing scan
        if: failure()
        run: |
          if [ ! -s pr-health.json ]; then
            echo '## Fleet PR Health: DEGRADED — no complete report was produced' >> "$GITHUB_STEP_SUMMARY"
          fi
