name: Fleet PR Health
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: fleet-pr-health
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/releasegraph" ./cmd/releasegraph
      - name: Create read-only fleet token
        id: reader
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASEGRAPH_CLIENT_ID }}
          private-key: ${{ secrets.RELEASEGRAPH_PRIVATE_KEY }}
          owner: ${{ vars.RELEASEGRAPH_OWNER }}
          # Administration is deliberately NOT requested: the App installation
          # does not have it. Required-check evidence then degrades to UNKNOWN
          # per pull request instead of failing the scan.
          permission-metadata: read
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
          permission-checks: read
      - name: Audit current PR heads
        env:
          RELEASEGRAPH_FLEET_TOKEN: ${{ steps.reader.outputs.token }}
        run: '"$RUNNER_TEMP/releasegraph" pr-health audit --manifest fleet.yaml --report pr-health.json'
      - name: Persist incidents on the control issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s pr-health.json ]; then
            echo 'no report produced; nothing to persist'
            exit 0
          fi
          "$RUNNER_TEMP/releasegraph" pr-health alert --report pr-health.json --apply
      - name: Preserve scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: pr-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: pr-health.json
          retention-days: 30
          if-no-files-found: error
      - name: Report missing scan
        if: failure()
        run: |
          if [ ! -s pr-health.json ]; then
            echo '## Fleet PR Health: DEGRADED — no complete report was produced' >> "$GITHUB_STEP_SUMMARY"
          fi
