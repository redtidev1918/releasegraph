# docsite-managed-file: update-download-page.yml
# docsite-managed-version: 2
# docsite: managed file, run `python3 docsite.py update` to refresh.
#
# 刷新下载页（docs/download.md 与语言镜像），并显式重建 Pages 文档站。
#
# 触发方式（按优先级）：
#   1. workflow_dispatch：传入精确 tag（ReleaseGraph post-release action 的入口）
#   2. release: published：手工发布或使用 PAT/App 创建的 Release 的兜底（exact tag 取自事件）
#      —— GITHUB_TOKEN 创建的 Release 不会触发该事件；那种情况必须走入口 1。
#   3. 不传 tag 时生成器回落到最新 stable Release，并在日志中明确说明。
#
# 注意：本 workflow 的 commit 由 GITHUB_TOKEN 推送，push 事件不会再次触发 Pages 部署，
# 因此提交成功后会显式 dispatch 文档站 workflow（默认 docs.yml，可在
# .github/scripts/download-page.json 的 docsWorkflow 覆盖）。
name: Probe gutted steps

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        description: Exact release tag to render (default: latest stable)
      deploy-docs:
        type: boolean
        required: false
        default: true
        description: Also dispatch the Pages workflow after the commit
  release:
    types: [published]

permissions:
  contents: write
  actions: write # 显式 dispatch 文档站 workflow（GITHUB_TOKEN 的 push 不会触发 push 型 workflow）

concurrency:
  group: update-download-page
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      tag: ${{ steps.render.outputs.tag }}
    steps:
      - run: echo probe
