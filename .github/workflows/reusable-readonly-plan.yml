name: ReleaseGraph Read-Only Plan
on:
  workflow_call:
    inputs:
      graph:
        required: false
        type: string
        default: release-graph.yml
      state:
        required: false
        type: string
        default: ""
      owner:
        required: false
        type: string
        default: ""
    secrets:
      # Fleet-scope discovery is a control-plane read: the engine refuses to
      # substitute the repository token (`FLEET_CREDENTIAL_REQUIRED`), so a
      # caller that passes `owner` must also provide this secret — normally with
      # `secrets: inherit`. Without it the discovery step fails exactly as it
      # did before this secret existed; a caller that omits `owner` is
      # unaffected.
      RELEASEGRAPH_FLEET_TOKEN:
        required: false
        description: Control-plane token used only by the `owner` discovery step.
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redtidev1918/releasegraph
          ref: v1
          path: .releasegraph-engine
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .releasegraph-engine/go.mod
      - name: Build read-only CLI
        run: (cd .releasegraph-engine && go build -trimpath -o ../releasegraph ./cmd/releasegraph)
      - name: Discover public fleet
        if: inputs.owner != ''
        run: ./releasegraph fleet --owner "${{ inputs.owner }}" --public-only --output json > fleet.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Only the fleet token satisfies `fleet discover`'s control-plane check;
          # absent (the default), the step behaves exactly as before.
          RELEASEGRAPH_FLEET_TOKEN: ${{ secrets.RELEASEGRAPH_FLEET_TOKEN }}
      - name: Compute graph plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GRAPH_PATH: ${{ inputs.graph }}
          STATE_PATH: ${{ inputs.state }}
        run: |
          if [ -n "$STATE_PATH" ]; then
            ./releasegraph plan --graph "$GRAPH_PATH" --state "$STATE_PATH" --output json > release-plan.json
          else
            ./releasegraph plan --graph "$GRAPH_PATH" --live --output json > release-plan.json
          fi
      - name: Show plan
        run: cat release-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: releasegraph-readonly-plan
          path: |
            fleet.json
            release-plan.json
          retention-days: 14
