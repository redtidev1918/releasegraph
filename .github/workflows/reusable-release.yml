name: Release Infrastructure v1

on:
  workflow_call:
    outputs:
      paths_released:
        description: "Release Please component paths released in this run"
        value: ${{ jobs.release_please.outputs.paths_released }}
      version:
        description: "Target release version"
        value: ${{ jobs.build-plan.outputs.version }}
      tag:
        description: "Target release tag"
        value: ${{ jobs.build-plan.outputs.tag }}
      run_release:
        description: "Whether the release path should run"
        value: ${{ jobs.build-plan.outputs.run_release }}
      release_health:
        description: "Current release health"
        value: ${{ jobs.build-plan.outputs.release_health }}
      pypi_enabled:
        description: "Whether PyPI is a configured registry"
        value: ${{ jobs.build-plan.outputs.pypi_enabled }}
      should_publish_pypi:
        description: "Whether the caller should publish this build to PyPI"
        value: ${{ jobs.build-plan.outputs.should_publish_pypi }}
    inputs:
      version: {type: string, default: ""}
      dry_run: {type: boolean, default: false}
      force: {type: boolean, default: false}
      repair: {type: boolean, default: false}
      stage: {type: string, default: all}
    secrets:
      RELEASE_PLEASE_TOKEN: {required: false}
      NPM_TOKEN: {required: false}
      ANDROID_KEYSTORE_B64: {required: false}
      ANDROID_KEYSTORE_PROPERTIES: {required: false}

concurrency:
  group: release-${{ github.repository }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  release_please:
    name: release-please
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.rp.outputs.paths_released }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  build-plan:
    needs: release_please
    if: always() && (needs.release_please.result == 'success' || needs.release_please.result == 'skipped')
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      run_release: ${{ steps.plan.outputs.run_release }}
      release_health: ${{ steps.plan.outputs.release_health }}
      tag_drift: ${{ steps.plan.outputs.tag_drift }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      test_command: ${{ steps.plan.outputs.test_command }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      has_assets: ${{ steps.plan.outputs.has_assets }}
      checksums_enabled: ${{ steps.plan.outputs.checksums_enabled }}
      needs_flutter: ${{ steps.plan.outputs.needs_flutter }}
      flutter_version: ${{ steps.plan.outputs.flutter_version }}
      needs_java: ${{ steps.plan.outputs.needs_java }}
      needs_go: ${{ steps.plan.outputs.needs_go }}
      go_version: ${{ steps.plan.outputs.go_version }}
      needs_goreleaser: ${{ steps.plan.outputs.needs_goreleaser }}
      pypi_enabled: ${{ steps.plan.outputs.pypi_enabled }}
      pypi_packages_dir: ${{ steps.plan.outputs.pypi_packages_dir }}
      should_publish_pypi: ${{ steps.plan.outputs.should_publish_pypi }}
      ghcr_enabled: ${{ steps.plan.outputs.ghcr_enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redtidev1918/releasegraph
          ref: main
          path: .releasegraph
      - name: Policy and release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_REPAIR: ${{ inputs.repair }}
        run: |
          set -euo pipefail
          args=(--github-output "$GITHUB_OUTPUT")
          [[ -n "$INPUT_VERSION" ]] && args+=(--version "$INPUT_VERSION")
          [[ "$INPUT_FORCE" == true ]] && args+=(--force)
          [[ "$INPUT_REPAIR" == true ]] && args+=(--repair)
          PYTHONPATH=.releasegraph python3 -m release_infra.cli static-check
          PYTHONPATH=.releasegraph python3 -m release_infra.cli workflow-plan "${args[@]}"
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        if: steps.plan.outputs.run_release == '1' && hashFiles('package.json') != ''
        with:
          node-version: 22
          cache: npm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.plan.outputs.run_release == '1' && steps.plan.outputs.needs_flutter == '1'
        with:
          flutter-version: ${{ steps.plan.outputs.flutter_version }}
          channel: stable
          cache: true
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: steps.plan.outputs.run_release == '1' && steps.plan.outputs.needs_java == '1'
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        if: steps.plan.outputs.run_release == '1' && steps.plan.outputs.needs_go == '1'
        with:
          go-version: ${{ steps.plan.outputs.go_version }}
          cache: true
      - name: Test
        if: steps.plan.outputs.run_release == '1' && steps.plan.outputs.test_command != ''
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          COMMAND: ${{ steps.plan.outputs.test_command }}
        run: bash -euo pipefail -c "$COMMAND"

  build:
    needs: build-plan
    if: always() && needs.build-plan.result == 'success' && needs.build-plan.outputs.run_release == '1'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        if: hashFiles('pyproject.toml', 'setup.py', 'requirements*.txt') != ''
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
          cache: npm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: needs.build-plan.outputs.needs_flutter == '1'
        with:
          flutter-version: ${{ needs.build-plan.outputs.flutter_version }}
          channel: stable
          cache: true
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: needs.build-plan.outputs.needs_java == '1'
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        if: needs.build-plan.outputs.needs_go == '1'
        with:
          go-version: ${{ needs.build-plan.outputs.go_version }}
          cache: true
      - name: Build
        env:
          RELEASE_VERSION: ${{ needs.build-plan.outputs.version }}
          RELEASE_TAG: ${{ needs.build-plan.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          COMMAND: ${{ matrix.command }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        shell: bash
        run: bash -euo pipefail -c "$COMMAND"
      - name: Binary version gate
        if: matrix.version_check != ''
        env:
          RELEASE_VERSION: ${{ needs.build-plan.outputs.version }}
          COMMAND: ${{ matrix.version_check }}
        shell: bash
        run: bash -euo pipefail -c "$COMMAND"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_0
        if: needs.build-plan.outputs.has_assets == '1'
        continue-on-error: true
        with:
          name: release-assets-${{ needs.build-plan.outputs.version }}-${{ strategy.job-index }}
          path: |
            dist/release/
            dist/pypi/
          if-no-files-found: error
          retention-days: 7
      - if: needs.build-plan.outputs.has_assets == '1' && steps.upload_0.outcome == 'failure'
        run: sleep 5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_1
        if: needs.build-plan.outputs.has_assets == '1' && steps.upload_0.outcome == 'failure'
        continue-on-error: true
        with:
          name: release-assets-${{ needs.build-plan.outputs.version }}-${{ strategy.job-index }}
          path: |
            dist/release/
            dist/pypi/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - if: needs.build-plan.outputs.has_assets == '1' && steps.upload_0.outcome == 'failure' && steps.upload_1.outcome == 'failure'
        run: sleep 20
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_2
        if: needs.build-plan.outputs.has_assets == '1' && steps.upload_0.outcome == 'failure' && steps.upload_1.outcome == 'failure'
        continue-on-error: true
        with:
          name: release-assets-${{ needs.build-plan.outputs.version }}-${{ strategy.job-index }}
          path: |
            dist/release/
            dist/pypi/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - if: needs.build-plan.outputs.has_assets == '1' && steps.upload_0.outcome == 'failure' && steps.upload_1.outcome == 'failure' && steps.upload_2.outcome == 'failure'
        run: sleep 60
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_3
        if: needs.build-plan.outputs.has_assets == '1' && steps.upload_0.outcome == 'failure' && steps.upload_1.outcome == 'failure' && steps.upload_2.outcome == 'failure'
        with:
          name: release-assets-${{ needs.build-plan.outputs.version }}-${{ strategy.job-index }}
          path: |
            dist/release/
            dist/pypi/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  finalize:
    needs: [build-plan, build]
    if: always() && needs.build.result == 'success' && needs.build-plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redtidev1918/releasegraph
          ref: main
          path: .releasegraph
      - name: Configure Git identity for release tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Reload release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_REPAIR: ${{ inputs.repair }}
        run: |
          set -euo pipefail
          args=(--github-output "$GITHUB_OUTPUT")
          [[ -n "$INPUT_VERSION" ]] && args+=(--version "$INPUT_VERSION")
          [[ "$INPUT_FORCE" == true ]] && args+=(--force)
          [[ "$INPUT_REPAIR" == true ]] && args+=(--repair)
          PYTHONPATH=.releasegraph python3 -m release_infra.cli workflow-plan "${args[@]}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        id: download_0
        if: steps.plan.outputs.run_release == '1' && steps.plan.outputs.has_assets == '1'
        continue-on-error: true
        with:
          pattern: release-assets-${{ steps.plan.outputs.version }}-*
          path: dist
          merge-multiple: true
      - if: steps.plan.outputs.has_assets == '1' && steps.download_0.outcome == 'failure'
        run: sleep 5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        id: download_1
        if: steps.plan.outputs.has_assets == '1' && steps.download_0.outcome == 'failure'
        continue-on-error: true
        with:
          pattern: release-assets-${{ steps.plan.outputs.version }}-*
          path: dist
          merge-multiple: true
      - if: steps.plan.outputs.has_assets == '1' && steps.download_0.outcome == 'failure' && steps.download_1.outcome == 'failure'
        run: sleep 20
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        id: download_2
        if: steps.plan.outputs.has_assets == '1' && steps.download_0.outcome == 'failure' && steps.download_1.outcome == 'failure'
        continue-on-error: true
        with:
          pattern: release-assets-${{ steps.plan.outputs.version }}-*
          path: dist
          merge-multiple: true
      - if: steps.plan.outputs.has_assets == '1' && steps.download_0.outcome == 'failure' && steps.download_1.outcome == 'failure' && steps.download_2.outcome == 'failure'
        run: sleep 60
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        id: download_3
        if: steps.plan.outputs.has_assets == '1' && steps.download_0.outcome == 'failure' && steps.download_1.outcome == 'failure' && steps.download_2.outcome == 'failure'
        with:
          pattern: release-assets-${{ steps.plan.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Flatten merged matrix artifacts
        if: steps.plan.outputs.run_release == '1'
        run: |
          set -euo pipefail
          mkdir -p dist/release dist/pypi
          find dist -type f ! -path 'dist/release/*' ! -path 'dist/pypi/*' -print0 |
          while IFS= read -r -d '' file; do
            if [[ "${{ steps.plan.outputs.pypi_enabled }}" == true && "$file" == *.whl ]]; then
              mv "$file" dist/pypi/
            elif [[ "${{ steps.plan.outputs.pypi_enabled }}" == true && "$file" == *.tar.gz ]]; then
              cp "$file" dist/pypi/
              mv "$file" dist/release/
            else
              mv "$file" dist/release/
            fi
          done
      - name: Asset gate and draft transaction
        if: steps.plan.outputs.run_release == '1' && steps.plan.outputs.release_health != 'healthy'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUILD_STARTED_AT: ${{ github.event.head_commit.timestamp }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--version '${{ steps.plan.outputs.version }}')
          [[ "$DRY_RUN" == true ]] && args+=(--dry-run)
          PYTHONPATH=.releasegraph python3 -m release_infra.cli asset-gate
          PYTHONPATH=.releasegraph python3 -m release_infra.cli stage "${args[@]}"
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        if: steps.plan.outputs.run_release == '1' && steps.plan.outputs.release_health != 'healthy' && contains(steps.plan.outputs.required_publish, 'npm publish')
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Required registry publication
        if: ${{ steps.plan.outputs.run_release == '1' && steps.plan.outputs.release_health != 'healthy' && !inputs.dry_run && steps.plan.outputs.required_publish != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          COMMAND: ${{ steps.plan.outputs.required_publish }}
        run: bash -euo pipefail -c "$COMMAND"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: ${{ steps.plan.outputs.run_release == '1' && steps.plan.outputs.release_health != 'healthy' && !inputs.dry_run && steps.plan.outputs.ghcr_enabled == 'true' }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: ${{ steps.plan.outputs.run_release == '1' && steps.plan.outputs.release_health != 'healthy' && !inputs.dry_run && steps.plan.outputs.ghcr_enabled == 'true' }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ steps.plan.outputs.run_release == '1' && steps.plan.outputs.release_health != 'healthy' && !inputs.dry_run && steps.plan.outputs.ghcr_enabled == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish GHCR image
        id: ghcr
        if: ${{ steps.plan.outputs.run_release == '1' && steps.plan.outputs.release_health != 'healthy' && !inputs.dry_run && steps.plan.outputs.ghcr_enabled == 'true' }}
        continue-on-error: ${{ steps.plan.outputs.ghcr_required != 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ steps.plan.outputs.ghcr_context }}
          file: ${{ steps.plan.outputs.ghcr_file }}
          platforms: ${{ steps.plan.outputs.ghcr_platforms }}
          push: true
          tags: ${{ steps.plan.outputs.ghcr_image }}:${{ steps.plan.outputs.version }},${{ steps.plan.outputs.ghcr_image }}:latest
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Required registry verification
        if: ${{ steps.plan.outputs.run_release == '1' && !inputs.dry_run && steps.plan.outputs.required_verify != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          COMMAND: ${{ steps.plan.outputs.required_verify }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if bash -euo pipefail -c "$COMMAND"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Optional publication channels
        if: ${{ steps.plan.outputs.run_release == '1' && !inputs.dry_run && steps.plan.outputs.optional_publish != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          COMMAND: ${{ steps.plan.outputs.optional_publish }}
        run: bash -uo pipefail -c "$COMMAND"
      - name: Optional channel verification
        if: ${{ steps.plan.outputs.run_release == '1' && !inputs.dry_run && steps.plan.outputs.optional_verify != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          COMMAND: ${{ steps.plan.outputs.optional_verify }}
        run: bash -uo pipefail -c "$COMMAND"
      - name: Publish, set Latest, audit, then prune Release objects
        if: steps.plan.outputs.run_release == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONTAINER_DIGEST: ${{ steps.ghcr.outputs.digest }}
          RELEASE_RETRY_COUNT: ${{ steps.plan.outputs.retry_count }}
        run: |
          set -euo pipefail
          if [[ '${{ steps.plan.outputs.release_health }}' == healthy ]]; then
            PYTHONPATH=.releasegraph python3 -m release_infra.cli audit --version '${{ steps.plan.outputs.version }}'
          else
            args=(--version '${{ steps.plan.outputs.version }}')
            [[ "$DRY_RUN" == true ]] && args+=(--dry-run)
            PYTHONPATH=.releasegraph python3 -m release_infra.cli publish "${args[@]}"
          fi
      - name: Optional post-release task
        if: ${{ steps.plan.outputs.run_release == '1' && !inputs.dry_run && steps.plan.outputs.post_publish != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          COMMAND: ${{ steps.plan.outputs.post_publish }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Release summary
        if: always()
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          STAGE: ${{ inputs.stage }}
          JOB_STATUS: ${{ job.status }}
          RETRY_COUNT: ${{ steps.plan.outputs.retry_count }}
          COOLDOWN: ${{ steps.plan.outputs.cooldown }}
          NEEDS_REPAIR: ${{ steps.plan.outputs.needs_repair }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Release Infrastructure v1
          - version: \`$VERSION\`
          - stage: \`$STAGE\`
          - result: \`$JOB_STATUS\`
          - retry count: \`$RETRY_COUNT\`
          - cooldown: \`$COOLDOWN\`
          - needs repair: \`$NEEDS_REPAIR\`
          - recovery: \`Run workflow → repair/retry current version\`
          EOF
