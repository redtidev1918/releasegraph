{
  "apiVersion": "releasegraph.dev/v1",
  "kind": "hybrid",
  "versioning": {
    "mode": "manual",
    "version": "1.4.8"
  },
  "assets": {
    "required": [
      "releasegraph-linux-amd64",
      "releasegraph-linux-arm64",
      "releasegraph-darwin-amd64",
      "releasegraph-darwin-arm64",
      "releasegraph-windows-amd64.exe",
      "releasegraph-windows-arm64.exe"
    ],
    "optional": [
      "RELEASEGRAPH-METADATA.json"
    ]
  },
  "registries": {
    "github": {
      "required": true
    }
  },
  "retention": {
    "stable": 1,
    "prerelease": 1,
    "failed_draft": 3,
    "pruneStable": true
  },
  "checksums": true,
  "metadata": true,
  "sbom": false
}
