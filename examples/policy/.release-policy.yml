apiVersion: releasegraph.dev/v1
kind: binary
versioning:
  provider: release-please
assets:
  required:
    - app-*-linux-amd64.tar.gz
    - app-*-darwin-arm64.tar.gz
    - app-*-windows-amd64.zip
registries:
  github:
    required: true
checksums: true
metadata: true
retention:
  stable: 5
  prerelease: 1
  failedDraft: 2
# Production-operation branch contract (optional namespace).
repository:
  git:
    productionOperations:
      base: default
      branches:
        - "chore/cutover-*"
        - "ops/*"
        - "release/*"
        - "hotfix/*"
      requireLatestBase: true
      operations:
        cutover:
          branches:
            - "chore/cutover-*"
          allowedPaths:
            - "control-plane/wrangler.toml"
            - "fly/*.toml"
            - ".github/workflows/**"
